# TEMPLATE ONLY — never commit real values. The deploy-k8s workflow creates this Secret
# from the GitHub secret OPENAI_API_KEY via `kubectl create secret ... --dry-run | kubectl apply -f -`.
# For a manual deploy, create it the same way (do not fill values here).
apiVersion: v1
kind: Secret
metadata:
  name: nc-chatbot-api-secrets
  namespace: nc-fullstack
type: Opaque
stringData:
  OPENAI_API_KEY: "__FROM_GH_SECRET__"
