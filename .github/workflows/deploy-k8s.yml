name: Deploy API to Kubernetes

# Replaces the former "Deploy API to Scaleway" serverless workflow (container decommissioned
# 2026-07-03). Builds/pushes the image to nc-reg, then applies the k8s manifests to the
# nc-fullstack namespace using a scoped kubeconfig (KUBE_CONFIG_DATA secret).

on:
  push:
    branches:
      - master
    paths:
      - 'ui/**'
      - 'api/**'
      - 'backend-ts/**'
      - 'shared/**'
      - 'dataprep/**'
      - 'k8s/**'
      - 'docker-compose.yml'
      - '.dockerignore'
      - 'Makefile'
      - '.github/workflows/deploy-k8s.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build and Publish API image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      api_version: ${{ steps.api_version.outputs.api_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend-ts/package-lock.json

      - name: Check if API image is up to date
        id: image-check
        run: make api-image-check-ci
        env:
          REGISTRY: ${{ secrets.REGISTRY }}
          DOCKER_USERNAME: nologin
          DOCKER_PASSWORD: ${{ secrets.SCW_SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          S3_DATAPREP_ACCESS_KEY: ${{ secrets.S3_DATAPREP_ACCESS_KEY }}
          S3_DATAPREP_SECRET_KEY: ${{ secrets.S3_DATAPREP_SECRET_KEY }}
        continue-on-error: true

      - name: Capture API version
        id: api_version
        run: echo "api_version=$(make api-version)" >> "$GITHUB_OUTPUT"

      - name: Download data and Build API
        run: make api-build-ci
        env:
          REGISTRY: ${{ secrets.REGISTRY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          S3_DATAPREP_ACCESS_KEY: ${{ secrets.S3_DATAPREP_ACCESS_KEY }}
          S3_DATAPREP_SECRET_KEY: ${{ secrets.S3_DATAPREP_SECRET_KEY }}
          API_VERSION: ${{ steps.api_version.outputs.api_version }}
        if: steps.image-check.outcome == 'failure'

      - name: Publish API docker image
        run: make api-image-publish
        env:
          REGISTRY: ${{ secrets.REGISTRY }}
          DOCKER_USERNAME: nologin
          DOCKER_PASSWORD: ${{ secrets.SCW_SECRET_KEY }}
          API_VERSION: ${{ steps.api_version.outputs.api_version }}
        if: steps.image-check.outcome == 'failure'

      - name: Login to GHCR
        if: steps.image-check.outcome == 'failure'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Publish API docker image to GHCR
        run: make api-image-publish-ghcr
        env:
          REGISTRY: ${{ secrets.REGISTRY }}
          API_VERSION: ${{ steps.api_version.outputs.api_version }}
        if: steps.image-check.outcome == 'failure'
        continue-on-error: true

  deploy:
    name: Deploy to k8s (nc-fullstack)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubectl
        run: |
          curl -sfLO "https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Configure kubeconfig
        run: |
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Apply secret + manifests
        env:
          API_VERSION: ${{ needs.build.outputs.api_version }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          kubectl -n nc-fullstack create secret generic nc-chatbot-api-secrets \
            --from-literal=OPENAI_API_KEY="$OPENAI_API_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -
          sed "s|__API_VERSION__|${API_VERSION}|g" k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/service.yaml -f k8s/networkpolicy.yaml
          kubectl -n nc-fullstack rollout status deploy/nc-chatbot-api --timeout=180s

      - name: Smoke deployed API
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://nc-api.sent-tech.ca/ping || true)
            if [ "$code" = "200" ]; then echo "smoke OK (200)"; exit 0; fi
            echo "attempt $i -> $code, retrying..."; sleep 6
          done
          echo "smoke failed"; exit 1
